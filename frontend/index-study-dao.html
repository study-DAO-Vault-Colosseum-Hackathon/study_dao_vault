<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOTES - Study DAO</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0d1128;
      color: #fff;
      overflow: hidden;
    }

    .container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Star dots */
    .stars-container {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      background-color: #d4af37;
      border-radius: 50%;
      opacity: 0.6;
    }

    /* Sign-in screen (STATE 1) */
    .signin-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
      z-index: 10;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .signin-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .title-section {
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .notes-title {
      font-size: 72px;
      font-weight: 700;
      letter-spacing: 10px;
      color: #d4af37;
      text-shadow: 0 0 30px rgba(212, 175, 55, 0.5), 0 0 60px rgba(212, 175, 55, 0.3);
      font-family: Georgia, serif;
      margin-bottom: 12px;
    }

    .notes-subtitle {
      font-size: 18px;
      font-style: italic;
      color: #d4af37;
      letter-spacing: 2px;
      font-weight: 300;
    }

    /* Indicators */
    .indicators {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: rgba(212, 175, 55, 0.3);
      transition: all 0.3s ease;
    }

    .indicator.active {
      background-color: #d4af37;
      width: 24px;
      border-radius: 4px;
    }

    /* Buttons container */
    .buttons-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 460px;
      padding: 0 20px;
    }

    .auth-button {
      width: 100%;
      padding: 16px 24px;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .auth-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    }

    .auth-button:active {
      transform: translateY(0);
    }

    .auth-button svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    .auth-button.google {
      background-color: #7c3aed;
      color: white;
    }

    .auth-button.github {
      background-color: #111;
      color: white;
    }

    .auth-button.discord {
      background-color: #5865F2;
      color: white;
    }

    .auth-button.microsoft {
      background-color: #f0f0ef;
      color: #1a1a1a;
    }

    .auth-button.apple {
      background-color: #000;
      color: white;
    }

    /* Loading overlay (STATE 2) */
    .loading-overlay {
      position: fixed;
      inset: 0;
      background: rgba(5, 8, 25, 0.75);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .loading-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    /* Spinning ring */
    .loading-ring {
      width: 80px;
      height: 80px;
      border: 4px solid rgba(212, 175, 55, 0.2);
      border-top-color: #7c3aed;
      border-right-color: #d4af37;
      border-radius: 50%;
      animation: spin 2s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Progress bar */
    .progress-container {
      width: 200px;
      height: 4px;
      background: rgba(212, 175, 55, 0.1);
      border-radius: 2px;
      overflow: hidden;
      border: 1px solid rgba(212, 175, 55, 0.3);
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #7c3aed, #d4af37);
      border-radius: 2px;
      width: 0%;
      transition: width 0.3s ease;
      box-shadow: 0 0 10px rgba(212, 175, 55, 0.6);
    }

    /* Loading message */
    .loading-message {
      font-size: 14px;
      color: rgba(212, 175, 55, 0.9);
      letter-spacing: 0.5px;
      min-height: 20px;
      animation: fadeInOut 0.6s ease-in-out infinite;
    }

    @keyframes fadeInOut {
      0%, 10% { opacity: 0; }
      20%, 80% { opacity: 1; }
      90%, 100% { opacity: 0; }
    }

    /* Username popup (STATE 3) */
    .username-popup {
      position: fixed;
      inset: 0;
      background: rgba(5, 8, 25, 0.75);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1001;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .username-popup.active {
      opacity: 1;
      visibility: visible;
    }

    .popup-card {
      background-color: #0f1631;
      border: 2px solid #2d3a5a;
      border-radius: 20px;
      padding: 48px 40px;
      max-width: 420px;
      width: 90%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      animation: slideUp 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .popup-icon {
      font-size: 48px;
    }

    .popup-title {
      font-size: 28px;
      font-weight: 700;
      color: #d4af37;
      text-align: center;
      font-family: Georgia, serif;
      letter-spacing: 1px;
    }

    .popup-subtitle {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.8);
      text-align: center;
      line-height: 1.5;
    }

    .input-group {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .input-label {
      font-size: 12px;
      color: rgba(212, 175, 55, 0.8);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .username-input {
      padding: 12px 16px;
      border: 2px solid #2d3a5a;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      font-size: 15px;
      font-family: inherit;
      transition: all 0.3s ease;
      outline: none;
    }

    .username-input:focus {
      border-color: #7c3aed;
      background: rgba(255, 255, 255, 0.12);
      box-shadow: 0 0 20px rgba(124, 58, 237, 0.2);
    }

    .username-input::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }

    .input-hint {
      font-size: 12px;
      color: rgba(212, 175, 55, 0.7);
      margin-top: 4px;
    }

    .input-hint.invalid {
      color: #ff6b6b;
    }

    .input-hint.valid {
      color: #51cf66;
    }

    /* Buttons */
    .popup-actions {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 8px;
    }

    .confirm-btn {
      width: 100%;
      padding: 14px 24px;
      background: linear-gradient(135deg, #d4af37, #f0a01f);
      color: #0f1631;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      letter-spacing: 0.5px;
    }

    .confirm-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(212, 175, 55, 0.4);
    }

    .confirm-btn:active:not(:disabled) {
      transform: translateY(0);
    }

    .confirm-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .skip-btn {
      width: 100%;
      padding: 12px 24px;
      background: transparent;
      color: rgba(212, 175, 55, 0.9);
      border: 2px solid rgba(212, 175, 55, 0.4);
      border-radius: 10px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      letter-spacing: 0.5px;
    }

    .skip-btn:hover {
      border-color: rgba(212, 175, 55, 0.8);
      color: #d4af37;
      background: rgba(212, 175, 55, 0.1);
    }

    /* Responsive */
    @media (max-width: 480px) {
      .notes-title {
        font-size: 48px;
        letter-spacing: 6px;
      }

      .notes-subtitle {
        font-size: 14px;
      }

      .auth-button {
        padding: 14px 20px;
        font-size: 14px;
      }

      .popup-card {
        padding: 32px 24px;
      }

      .popup-title {
        font-size: 24px;
      }

      .popup-subtitle {
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="stars-container" id="starsContainer"></div>

    <!-- STATE 1: Sign-in Screen -->
    <div class="signin-screen" id="signinScreen">
      <div class="title-section">
        <h1 class="notes-title">NOTES</h1>
        <p class="notes-subtitle">your thoughts, kept</p>
        <div class="indicators">
          <div class="indicator active"></div>
          <div class="indicator"></div>
          <div class="indicator"></div>
        </div>
      </div>

      <div class="buttons-container">
        <!-- Google Button -->
        <button class="auth-button google" data-provider="google">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path fill="currentColor" d="M21.35 11.1H12v2.98h5.35a4.56 4.56 0 0 1-1.98 3.08v2.56h3.21c1.88-1.73 2.97-4.28 2.97-7.31 0-.9-.08-1.58-.2-2.31Z"/>
            <path fill="currentColor" d="M12 22c2.7 0 4.97-.9 6.63-2.43l-3.21-2.56c-.89.6-2.02.95-3.42.95-2.63 0-4.86-1.78-5.65-4.19H2.98v2.62C4.63 19.54 8 22 12 22Z" opacity="0.96"/>
            <path fill="currentColor" d="M6.35 13.77a5.95 5.95 0 0 1 0-3.54V7.61H2.98a9.99 9.99 0 0 0 0 8.78l3.37-2.62Z" opacity="0.96"/>
            <path fill="currentColor" d="M12 5.88c1.46 0 2.77.5 3.8 1.47l2.83-2.82A9.72 9.72 0 0 0 12 2C8 2 4.63 4.46 2.98 7.61l3.37 2.62C7.14 7.66 9.37 5.88 12 5.88Z" opacity="0.96"/>
          </svg>
          <span>Google</span>
        </button>

        <!-- GitHub Button -->
        <button class="auth-button github" data-provider="github">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path fill="currentColor" d="M12 .5a11.5 11.5 0 0 0-3.64 22.4c.57.1.78-.25.78-.56v-2.1c-3.18.69-3.85-1.3-3.85-1.3-.52-1.34-1.28-1.7-1.28-1.7-1.05-.73.08-.72.08-.72 1.17.08 1.8 1.2 1.8 1.2 1.04 1.79 2.74 1.27 3.41.97.1-.76.4-1.28.74-1.57-2.52-.29-5.17-1.28-5.17-5.7 0-1.26.45-2.3 1.2-3.1-.12-.3-.52-1.47.11-3.05 0 0 .98-.32 3.2 1.2a11.2 11.2 0 0 1 5.83 0c2.22-1.52 3.2-1.2 3.2-1.2.63 1.58.23 2.75.11 3.05.75.8 1.2 1.84 1.2 3.1 0 4.43-2.66 5.41-5.2 5.69.41.35.79 1.08.79 2.18v3.23c0 .31.21.67.78.56A11.5 11.5 0 0 0 12 .5Z"/>
          </svg>
          <span>GitHub</span>
        </button>

        <!-- Discord Button -->
        <button class="auth-button discord" data-provider="discord">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path fill="currentColor" d="M19.5 5.2A16.3 16.3 0 0 0 15.9 4l-.18.37a14.2 14.2 0 0 1 2.36 1.12 12 12 0 0 0-7.08-1.05 12.4 12.4 0 0 0-5.16 1.04A14.6 14.6 0 0 1 8.17 4l-.18-.37a16.3 16.3 0 0 0-3.6 1.2C2.7 8.3 2.16 11.67 2.4 15.02a16.3 16.3 0 0 0 4.9 2.48l.58-.96c-.72-.27-1.4-.6-2.05-.97.17-.12.33-.24.49-.38 3.94 1.86 8.29 1.86 12.2 0 .16.14.32.26.49.38-.65.37-1.33.7-2.05.97l.58.96a16.3 16.3 0 0 0 4.9-2.48c.31-3.88-.5-7.22-2.36-9.82Zm-10.1 8.45c-.9 0-1.63-.84-1.63-1.88s.73-1.88 1.64-1.88c.9 0 1.63.84 1.63 1.88s-.73 1.88-1.64 1.88Zm5.38 0c-.9 0-1.63-.84-1.63-1.88s.73-1.88 1.64-1.88c.9 0 1.63.84 1.63 1.88s-.73 1.88-1.64 1.88Z"/>
          </svg>
          <span>Discord</span>
        </button>

        <!-- Microsoft Button -->
        <button class="auth-button microsoft" data-provider="microsoft">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <rect x="3" y="3" width="8" height="8" fill="currentColor"/>
            <rect x="13" y="3" width="8" height="8" fill="currentColor"/>
            <rect x="3" y="13" width="8" height="8" fill="currentColor"/>
            <rect x="13" y="13" width="8" height="8" fill="currentColor"/>
          </svg>
          <span>Microsoft</span>
        </button>

        <!-- Apple Button -->
        <button class="auth-button apple" data-provider="apple">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path fill="currentColor" d="M16.7 13.1c0-1.76 1.01-3.28 2.55-4.13-1.02-1.42-2.58-2.26-4.05-2.26-1.6 0-2.33.76-3.41.76-1.12 0-2-.76-3.37-.76-2.1 0-4.28 1.83-4.28 5.25 0 2.14.83 4.41 1.85 5.88.87 1.22 1.61 2.07 2.7 2.07 1.05 0 1.47-.68 2.78-.68 1.34 0 1.69.66 2.78.66 1.09 0 1.82-.9 2.5-1.97.77-1.17 1.09-2.3 1.09-2.36-.02-.01-2.09-.8-2.14-3.46Zm-2.2-5.87c.72-.86 1.22-2.03 1.09-3.19-1.04.04-2.32.69-3.06 1.55-.67.75-1.25 1.93-1.1 3.08 1.14.08 2.33-.58 3.07-1.44Z"/>
          </svg>
          <span>Apple</span>
        </button>
      </div>
    </div>

    <!-- STATE 2: Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
      <div class="loading-container">
        <div class="loading-ring"></div>
        <div class="progress-container">
          <div class="progress-bar" id="progressBar"></div>
        </div>
        <p class="loading-message" id="loadingMessage">Checking your account…</p>
      </div>
    </div>

    <!-- STATE 3: Username Popup -->
    <div class="username-popup" id="usernamePopup">
      <div class="popup-card">
        <div class="popup-icon">📖</div>
        <h2 class="popup-title">Welcome to NOTES</h2>
        <p class="popup-subtitle">Looks like it's your first time here. Choose a display name to get started.</p>

        <div class="input-group">
          <label class="input-label">Display Name</label>
          <input 
            type="text" 
            class="username-input" 
            id="usernameInput" 
            placeholder="e.g. thoughtkeeper_42"
            maxlength="24"
          >
          <p class="input-hint" id="inputHint">Only letters, numbers, and underscores. Max 24 chars.</p>
        </div>

        <div class="popup-actions">
          <button class="confirm-btn" id="confirmBtn" disabled>Let's go →</button>
          <button class="skip-btn" id="skipBtn">Skip for now</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // STATE MANAGEMENT
    const state = {
      currentState: 'signin', // signin, loading, username
      username: '',
      provider: null,
      isFirstTime: false
    };

    // MESSAGES
    const loadingMessages = [
      'Checking your account…',
      'Verifying with provider…',
      'Almost ready…'
    ];

    // DOM ELEMENTS
    const elements = {
      signinScreen: document.getElementById('signinScreen'),
      loadingOverlay: document.getElementById('loadingOverlay'),
      usernamePopup: document.getElementById('usernamePopup'),
      progressBar: document.getElementById('progressBar'),
      loadingMessage: document.getElementById('loadingMessage'),
      usernameInput: document.getElementById('usernameInput'),
      inputHint: document.getElementById('inputHint'),
      confirmBtn: document.getElementById('confirmBtn'),
      skipBtn: document.getElementById('skipBtn'),
      starsContainer: document.getElementById('starsContainer'),
      authButtons: document.querySelectorAll('.auth-button')
    };

    // UTILITIES
    function generateStars() {
      const count = 50;
      for (let i = 0; i < count; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        star.style.left = Math.random() * 100 + '%';
        star.style.top = Math.random() * 100 + '%';
        star.style.opacity = Math.random() * 0.6 + 0.3;
        elements.starsContainer.appendChild(star);
      }
    }

    function validateUsername(username) {
      return /^[a-zA-Z0-9_]{1,24}$/.test(username);
    }

    function updateState(newState) {
      state.currentState = newState;
      renderState();
    }

    function renderState() {
      const { signin, loading, username: usernameOverlay } = {
        signin: 'signin',
        loading: 'loading',
        username: 'username'
      };

      // Hide all
      elements.signinScreen.classList.add('hidden');
      elements.loadingOverlay.classList.remove('active');
      elements.usernamePopup.classList.remove('active');

      // Show current state
      if (state.currentState === 'signin') {
        elements.signinScreen.classList.remove('hidden');
      } else if (state.currentState === 'loading') {
        elements.loadingOverlay.classList.add('active');
      } else if (state.currentState === 'username') {
        elements.usernamePopup.classList.add('active');
      }
    }

    // LOADING ANIMATION
    function simulateLoading() {
      let progress = 0;
      let messageIndex = 0;

      const progressInterval = setInterval(() => {
        progress += Math.random() * 30;
        if (progress > 100) progress = 100;
        elements.progressBar.style.width = progress + '%';

        if (progress === 100) clearInterval(progressInterval);
      }, 100);

      const messageInterval = setInterval(() => {
        elements.loadingMessage.textContent = loadingMessages[messageIndex];
        messageIndex = (messageIndex + 1) % loadingMessages.length;
      }, 600);

      // After 2 seconds, show username popup (simulating first-time user)
      setTimeout(() => {
        clearInterval(messageInterval);
        // Simulate first-time check (in real app, this would check backend)
        state.isFirstTime = true; // Change to false for returning user
        
        if (state.isFirstTime) {
          updateState('username');
        } else {
          // Returning user: close overlay and reset
          updateState('signin');
        }
      }, 2000);
    }

    // USERNAME INPUT HANDLING
    elements.usernameInput.addEventListener('input', (e) => {
      state.username = e.target.value;
      const isValid = validateUsername(state.username);

      // Update button state
      elements.confirmBtn.disabled = !isValid;

      // Update hint
      if (state.username.length === 0) {
        elements.inputHint.textContent = 'Only letters, numbers, and underscores. Max 24 chars.';
        elements.inputHint.classList.remove('valid', 'invalid');
      } else if (isValid) {
        elements.inputHint.textContent = '✓ Valid username';
        elements.inputHint.classList.remove('invalid');
        elements.inputHint.classList.add('valid');
      } else {
        elements.inputHint.textContent = '✗ Invalid format';
        elements.inputHint.classList.remove('valid');
        elements.inputHint.classList.add('invalid');
      }
    });

    // BUTTON HANDLERS
    elements.confirmBtn.addEventListener('click', () => {
      if (validateUsername(state.username)) {
        console.log('Username saved:', state.username);
        // In real app: save to backend
        updateState('signin');
        elements.usernameInput.value = '';
        state.username = '';
      }
    });

    elements.skipBtn.addEventListener('click', () => {
      console.log('Username skipped');
      updateState('signin');
      elements.usernameInput.value = '';
      state.username = '';
    });

    // AUTH BUTTON HANDLERS
    elements.authButtons.forEach(button => {
      button.addEventListener('click', () => {
        state.provider = button.getAttribute('data-provider');
        console.log('Sign-in with:', state.provider);
        updateState('loading');
        simulateLoading();
      });
    });

    // INITIALIZATION
    generateStars();
    renderState();
  </script>
</body>
</html>
